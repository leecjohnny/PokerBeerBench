services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pokerbeer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['54329:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pokerbeer']
      interval: 1s
      timeout: 3s
      retries: 30
