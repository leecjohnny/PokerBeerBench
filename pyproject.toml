[project]
name = "pokerbeer-bench"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["harbor==0.22.0"]

[dependency-groups]
dev = ["ruff==0.15.22", "ty==0.0.80"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["harbor"]
